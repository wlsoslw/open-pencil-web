    <style>
      /* Pre-boot support notice; the app CSS never loads when it shows. */
      #boot-notice {
        box-sizing: border-box;
        min-height: 100vh;
        padding: 48px 24px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        max-width: 560px;
        margin: 0 auto;
        text-align: center;
        color: rgb(var(--loader-fg));
        background: var(--loader-bg);
        font: 14px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      #boot-notice img { width: 40px; height: 40px; margin-bottom: 8px; }
      #boot-notice h1 { margin: 0; font-size: 18px; font-weight: 600; }
      #boot-notice p { margin: 0; color: rgba(var(--loader-fg), 0.75); }
      #boot-notice nav { margin-top: 8px; color: rgba(var(--loader-fg), 0.45); }
      #boot-notice a { color: rgb(var(--loader-fg)); text-underline-offset: 3px; }
      #boot-notice details { margin-top: 16px; max-width: 100%; color: rgba(var(--loader-fg), 0.6); }
      #boot-notice summary { cursor: pointer; }
      #boot-notice pre {
        margin: 8px 0 0;
        padding: 12px;
        max-height: 40vh;
        overflow: auto;
        text-align: left;
        white-space: pre-wrap;
        word-break: break-word;
        font-size: 12px;
        border-radius: 6px;
        background: rgba(var(--loader-fg), 0.06);
        user-select: text;
        -webkit-user-select: text;
      }
    </style>

    <style>:root{--loader-bg:#1e1e1e;--loader-fg:255, 255, 255}@media (prefers-color-scheme:light){:root{--loader-bg:#f3f4f6;--loader-fg:32, 33, 36}}html[data-theme=dark]{--loader-bg:#1e1e1e;--loader-fg:255, 255, 255}html[data-theme=light]{--loader-bg:#f3f4f6;--loader-fg:32, 33, 36}body{background:var(--loader-bg);margin:0}#boot-splash{z-index:9999;color:rgb(var(--loader-fg));background:var(--loader-bg);justify-content:center;align-items:center;display:flex;position:fixed;inset:0}#app:not(:empty)~#boot-splash{display:none}#boot-splash:before{content:"";background:url(/brand/app-icon.svg) 50%/contain no-repeat;width:40px;height:40px}#boot-splash .bar{background:rgba(var(--loader-fg), .08);border-radius:1px;width:100px;height:2px;position:absolute;bottom:50%;left:50%;overflow:hidden;transform:translate(-50%,40px)}#boot-splash .bar:after{content:"";background:rgba(var(--loader-fg), .25);border-radius:1px;width:40%;height:100%;animation:1s ease-in-out infinite slide;display:block}@keyframes slide{0%{transform:translate(-100%)}to{transform:translate(350%)}}@media (prefers-reduced-motion:reduce){#boot-splash .bar:after{animation:none}}
/*$vite$:1*/</style>
    <script>(function(){function e(e,t){return e===`auto`?t?`dark`:`light`:e===`light`?`light`:`dark`}function t(){try{return localStorage.getItem(`open-pencil:theme`)}catch{return null}}document.documentElement.dataset.theme=e(t(),matchMedia(`(prefers-color-scheme: dark)`).matches)})();</script>
